[build]
  # This tells Netlify where your functions are located
  functions = "netlify/functions"
  # This tells Netlify where your website files (index.html, etc) are
  publish = "."

[functions]
  # This tells Netlify to use modern bundling for your Node.js code
  node_bundler = "esbuild"

[[redirects]]
  # This makes your API calls cleaner: /api/activate-license -> the function
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200